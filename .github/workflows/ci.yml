name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Integration tests start PostgreSQL 18 through Testcontainers using the runner's Docker daemon.
      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Generate quality summary
        if: always()
        run: python3 .github/scripts/quality-summary.py

      - name: Add quality summary to workflow run
        if: always()
        run: cat build/reports/quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update pull request comment
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ci-quality-summary -->"))) | .id' \
            | head -n 1)

          jq -Rs '{body: .}' build/reports/quality-summary.md > build/reports/quality-comment.json

          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --method PATCH \
              --input build/reports/quality-comment.json
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method POST \
              --input build/reports/quality-comment.json
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
            build/reports/quality-summary.md
          if-no-files-found: warn
          retention-days: 14
