spring.application.name=courier-tracking
spring.profiles.default=local
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=none
# Services own their transactions; do not hold a connection for the whole HTTP request.
spring.jpa.open-in-view=false

springdoc.show-actuator=true
springdoc.swagger-ui.try-it-out-enabled=true

# Kafka ingress is opt-in; the local profile enables it (S010).
courier.kafka.enabled=false
